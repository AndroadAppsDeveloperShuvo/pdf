<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to PDF Pro - By Shuvo</title>

  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- Toastify -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />

  <style>
    /* Professional Theme Variables */
    :root {
      --bg-color: #e2e8f0;
      --card-bg: #ffffff;
      --text-main: #000000;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
      --success: #10b981;
      --share: #8b5cf6;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #020617;
      --card-bg: #0f172a;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --border-color: #334155;
      --input-bg: #1e293b;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .uploader-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    /* Header & Settings */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header h1 { font-size: 22px; font-weight: 800; color: var(--text-main); }
    
    .settings-btn { background: transparent; border: none; color: var(--text-main); cursor: pointer; padding: 8px; border-radius: 50%; }
    .settings-btn:hover { background: var(--border-color); }
    .settings-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .settings-dropdown {
      position: absolute; top: 70px; right: 30px; background: var(--card-bg); border: 2px solid var(--border-color);
      box-shadow: var(--shadow-lg); border-radius: 12px; padding: 15px; width: 180px; display: none; z-index: 10;
    }
    .settings-dropdown.active { display: block; animation: popIn 0.2s ease-out; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700;}
    
    /* Toggle */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); border-radius: 34px; transition: .4s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .4s; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Drag & Drop Zone */
    .drop-zone {
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      background: var(--input-bg);
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: rgba(37, 99, 235, 0.1);
      border-color: var(--primary-hover);
    }
    .drop-zone svg { width: 45px; height: 45px; fill: var(--primary); margin-bottom: 10px; }
    .drop-zone p { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
    .drop-zone span { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    #images { display: none; }

    /* Previews */
    .preview-container {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; justify-content: center;
    }
    .preview-container img {
      width: 70px; height: 70px; object-fit: cover; border-radius: 8px;
      border: 2px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      animation: popIn 0.3s ease;
    }

    /* Buttons */
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; 
      font-weight: 800; cursor: pointer; transition: 0.2s; color: #fff; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:disabled { background: var(--border-color) !important; cursor: not-allowed; transform: none; color: var(--text-muted); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    
    .btn-primary { background: var(--primary); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    
    .btn-success { background: var(--success); }
    .btn-success:hover:not(:disabled) { background: #059669; }

    .btn-share { background: var(--share); }
    .btn-share:hover:not(:disabled) { background: #7c3aed; }

    /* Action Grid */
    .action-grid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      animation: fadeIn 0.4s ease;
    }

    /* Footer */
    .footer { margin-top: 25px; text-align: center; font-size: 14px; color: var(--text-muted); font-weight: 600; }
    .footer span { color: var(--primary); font-weight: 800; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="uploader-card">
    
    <!-- Header -->
    <div class="header">
      <h1>Image to PDF Pro</h1>
      <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      </button>

      <div class="settings-dropdown" id="settingsMenu">
        <div class="setting-item">
          <span>Dark Mode</span>
          <label class="switch"><input type="checkbox" id="themeToggle" onchange="toggleTheme()"><span class="slider"></span></label>
        </div>
      </div>
    </div>

    <!-- Drag & Drop Zone -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('images').click()">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <p>Drag & Drop Images here</p>
      <span>or click to browse (Select Multiple)</span>
      <input type="file" id="images" multiple accept="image/*">
    </div>

    <!-- Preview Container -->
    <div class="preview-container" id="preview"></div>

    <!-- Initial Action Button -->
    <button id="generateBtn" class="btn btn-primary" disabled>⚙️ Generate PDF</button>

    <!-- Post Generation Action Buttons -->
    <div class="action-grid" id="actionGrid">
      <button id="downloadLocalBtn" class="btn btn-success">📥 Download</button>
      <button id="shareBtn" class="btn btn-share">📤 Share</button>
    </div>

    <!-- Footer -->
    <div class="footer">Developed by <span>Developer Shuvo</span></div>
  </div>

<script>
  // --- Theme Setup ---
  document.addEventListener("DOMContentLoaded", () => {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if(savedTheme === 'dark') document.getElementById('themeToggle').checked = true;

    // Check if browser supports file sharing
    checkShareSupport();
  });

  function toggleSettings() { document.getElementById('settingsMenu').classList.toggle('active'); }
  document.addEventListener('click', function(event) {
    const menu = document.getElementById('settingsMenu');
    const btn = document.getElementById('settingsBtn');
    if (!menu.contains(event.target) && !btn.contains(event.target)) {
      menu.classList.remove('active');
    }
  });

  function toggleTheme() {
    const isDark = document.getElementById('themeToggle').checked;
    const newTheme = isDark ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  }

  // --- UI Elements ---
  const dropZone = document.getElementById('dropZone');
  const imagesInput = document.getElementById('images');
  const previewDiv = document.getElementById('preview');
  
  const generateBtn = document.getElementById('generateBtn');
  const actionGrid = document.getElementById('actionGrid');
  const downloadLocalBtn = document.getElementById('downloadLocalBtn');
  const shareBtn = document.getElementById('shareBtn');

  let selectedFiles = [];
  let pdfBlob = null;
  let pdfFileName = `Image_to_PDF_Shuvo_${Date.now()}.pdf`;

  // --- Check Share Support ---
  function checkShareSupport() {
    try {
      // Test if sharing files is possible
      const testFile = new File([''], 'test.pdf', { type: 'application/pdf' });
      if (!navigator.canShare || !navigator.canShare({ files: [testFile] })) {
        // If not supported, hide the share button and make download button full width
        shareBtn.style.display = 'none';
        actionGrid.style.gridTemplateColumns = '1fr';
      }
    } catch (e) {
      shareBtn.style.display = 'none';
      actionGrid.style.gridTemplateColumns = '1fr';
    }
  }

  // --- Drag & Drop Handling ---
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      imagesInput.files = e.dataTransfer.files;
      handleFilesSelection();
    }
  });

  imagesInput.addEventListener('change', handleFilesSelection);

  function handleFilesSelection() {
    previewDiv.innerHTML = '';
    actionGrid.style.display = 'none';
    generateBtn.style.display = 'block';
    pdfBlob = null;
    selectedFiles = Array.from(imagesInput.files);
    
    if (selectedFiles.length === 0) {
      generateBtn.disabled = true;
      return;
    }
    
    selectedFiles.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        previewDiv.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
    generateBtn.disabled = false;
  }

  // --- 1. Generate PDF Locally ---
  generateBtn.addEventListener('click', async () => {
    generateBtn.disabled = true;
    generateBtn.innerText = "⚙️ Processing PDF...";

    try {
      await generatePDFData();
      if (pdfBlob) {
        showToast('PDF Generated Successfully!', '#10b981');
        generateBtn.style.display = 'none';
        generateBtn.innerText = "⚙️ Generate PDF";
        generateBtn.disabled = false;
        
        // Show Action Options
        actionGrid.style.display = 'grid';
      }
    } catch (error) {
      showToast('Error generating PDF!', '#ef4444');
      generateBtn.innerText = "⚙️ Generate PDF";
      generateBtn.disabled = false;
      console.error(error);
    }
  });

  async function generatePDFData() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    for (let i = 0; i < selectedFiles.length; i++) {
      const file = selectedFiles[i];
      const dataUrl = await readFileAsDataURL(file);
      const img = new Image();
      img.src = dataUrl;
      await new Promise(resolve => {
        img.onload = () => {
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          let imgWidth = pageWidth;
          let imgHeight = (img.height * imgWidth) / img.width;
          if (imgHeight > pageHeight) {
            imgHeight = pageHeight;
            imgWidth = (img.width * imgHeight) / img.height;
          }
          const x = (pageWidth - imgWidth) / 2;
          const y = (pageHeight - imgHeight) / 2;
          pdf.addImage(img, 'JPEG', x, y, imgWidth, imgHeight);
          if (i < selectedFiles.length - 1) pdf.addPage();
          resolve();
        };
      });
    }
    pdfBlob = pdf.output('blob');
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = err => reject(err);
      fr.readAsDataURL(file);
    });
  }

  // --- 2. Direct Download ---
  downloadLocalBtn.addEventListener('click', () => {
    if (!pdfBlob) return;
    const url = window.URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = pdfFileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    showToast('Download Started!', '#10b981');
  });

  // --- 3. Native Share (Direct) ---
  shareBtn.addEventListener('click', async () => {
    if (!pdfBlob) return;
    
    if (navigator.share && navigator.canShare) {
      const file = new File([pdfBlob], pdfFileName, { type: 'application/pdf' });
      
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Image to PDF - Shuvo',
            text: 'Here is the PDF generated using Image to PDF Pro!'
          });
          showToast('Shared successfully!', '#10b981');
        } catch (error) {
          console.log('Sharing canceled or failed', error);
        }
      }
    }
  });

  function showToast(message, color) {
    Toastify({
      text: message, duration: 3500, gravity: "top", position: "center",
      style: { background: color, borderRadius: "8px", fontWeight: "bold" },
    }).showToast();
  }
</script>
</body>
</html>
